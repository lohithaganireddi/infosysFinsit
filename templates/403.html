{% extends 'base.html' %}
{% block title %}403 – Access Forbidden | FinSight{% endblock %}
{% block content %}
<main class="error-page-container">
  <div class="error-card">
    <div class="error-illustration">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div class="error-code" style="color:#EF4444;">403</div>
    <h2 class="error-title">Access Forbidden</h2>
    <p class="error-message">You do not have permission to access this page or resource. Please navigate back to the dashboard.</p>
    <div class="error-actions">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="width:auto;min-width:140px;">Back to Dashboard</a>
      <a href="{{ url_for('login') }}" class="btn btn-secondary" style="width:auto;min-width:140px;margin-top:0;">Back to Login</a>
    </div>
  </div>
</main>
{% endblock %}
